# Blueprint for one client's Render services (P10). One shared codebase, deployed
# separately per client: 1 API web service + 1 background worker (ARCHITECTURE.md).
# VALUES LIVE IN RENDER ENV, NEVER HERE: every key below is `sync: false`, so
# `render.yaml` carries names only. Provision secrets per client in the dashboard.
# Keys mirror api/.env.example and worker/.env.example (required, no defaults).

services:
  - type: web
    name: ragbot-api
    runtime: node
    plan: standard
    buildCommand: npm ci && npm run build
    startCommand: npm run start -w api
    healthCheckPath: /health/ready
    envVars:
      # Pinned to the repo toolchain (ADR 0018, .nvmrc). Render also reads
      # package.json engines; this makes the version explicit per service.
      - key: NODE_VERSION
        value: 26.13.1
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: VISITOR_TOKEN_SECRET
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: RATE_LIMIT_KEY_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: PORT
        sync: false
      - key: LOG_LEVEL
        sync: false
      - key: TRUSTED_PROXY_HOPS
        sync: false
