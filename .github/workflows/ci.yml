name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Secret scan (tracked files) and its self-test
        run: |
          bash scripts/secret-scan.sh --self-test
          bash scripts/secret-scan.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - name: Start local Supabase stack
        run: npx supabase start
      - name: Apply migrations and run database tests (pgTAP)
        run: |
          npx supabase db reset
          npm run test:db
      - name: Database lint (local)
        run: npx supabase db lint --local
      - name: Database race checks (two connections)
        run: bash scripts/race-db.sh
      - name: Makefile guard tests
        run: bash scripts/test-make-guards.sh
      - run: npm run test:integration
      - run: npm run build
      - name: API smoke test (built output against the local stack)
        run: node scripts/api-smoke.mjs
      - name: Worker PDF extraction from the build (P6)
        run: node scripts/worker-dist-check.mjs
      - name: Stop local Supabase stack
        if: always()
        run: npx supabase stop --no-backup

  # Windows is dev-convenience only: static gates + the unit suites that are
  # green on Windows (api 1494, widget 45). Full DB/race/integration/smoke
  # gates stay on ubuntu-24.04 above (production is Linux; race-db needs a
  # unix docker socket, make guards need make). Not a gate on its own.
  check-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npx vitest run --project unit tests/unit/api tests/unit/widget tests/unit/scaffold.test.ts
      - run: npm run build -w widget
      - run: node scripts/worker-dist-check.mjs
